<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080514"/>
      <stop offset="50%" stop-color="#0f0b24"/>
      <stop offset="100%" stop-color="#140a33"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="purpleGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#080514" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#centerGlow)"/>

  <!-- Subtle Subtle Grid Background -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Glassmorphic Card Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="28" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Top Center Brand Pill -->
  <g transform="translate(600, 100)">
    <rect x="-160" y="-20" width="320" height="40" rx="20" fill="rgba(147, 51, 234, 0.2)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#e9d5ff" letter-spacing="3">
      ✨ AI PUBLISHING SUITE
    </text>
  </g>

  <!-- Central Logo Emblem & Branding -->
  <g transform="translate(600, 230)">
    <!-- Outer Gold / Purple Crest Ring -->
    <circle cx="0" cy="0" r="64" fill="none" stroke="url(#purpleGold)" stroke-width="3" stroke-dasharray="10 4" opacity="0.9"/>
    <circle cx="0" cy="0" r="54" fill="#0f0a28" stroke="rgba(192, 132, 252, 0.5)" stroke-width="2"/>

    <!-- Open Book Vector Path -->
    <path d="M-32 18 C-16 10 -4 14 0 20 C4 14 16 10 32 18 L28 -12 C14 -18 4 -16 0 -10 C-4 -16 -14 -18 -28 -12 Z" fill="#2e1065" stroke="#c084fc" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Feather Quill Vector Path -->
    <path d="M0 -36 C16 -24 18 -6 0 8 C-2 -4 -6 -18 0 -36 Z" fill="url(#purpleGold)"/>
    <path d="M0 8 L-3 18 L3 16 Z" fill="#fbbf24"/>
    <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Title Headline -->
  <text x="600" y="360" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="900" fill="url(#textGrad)" letter-spacing="-1">
    KDP Studio
  </text>

  <!-- Subtitle Tagline -->
  <text x="600" y="420" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#94a3b8" letter-spacing="0">
    Create, Format &amp; Publish Amazon KDP Books with AI
  </text>

  <!-- 3 Feature Badges in Row -->
  <g transform="translate(600, 500)">
    <!-- Badge 1 -->
    <g transform="translate(-320, 0)">
      <rect x="-100" y="-18" width="200" height="36" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">
        ⚡ Gemini 2.0 AI Writing
      </text>
    </g>

    <!-- Badge 2 -->
    <g transform="translate(0, 0)">
      <rect x="-105" y="-18" width="210" height="36" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">
        📐 300 DPI Formatter
      </text>
    </g>

    <!-- Badge 3 -->
    <g transform="translate(320, 0)">
      <rect x="-100" y="-18" width="200" height="36" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">
        🎨 Full Cover Spreads
      </text>
    </g>
  </g>
</svg>
